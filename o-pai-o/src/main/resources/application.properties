spring.application.name=o-pai-o

spring.datasource.url=jdbc:postgresql://localhost:5432/DevLapa
spring.datasource.username=postgres
spring.datasource.password=""
spring.datasource.driver-class-name=org.postgresql.Driver

spring.mail.host=smtp.gmail.com
spring.mail.port=587

spring.mail.username=${GMAIL_USER}
spring.mail.password=${GMAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# URL do seu Front-end React
app.frontend.url=http://localhost:5173

spring.jpa.hibernate.ddl-auto=update
spring.flyway.enabled=true
spring.flyway.out-of-order=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
api.security.token.secret=${JWT_SECRET:89324789237489237489237489}
spring.mvc.hiddenmethod.filter.enabled=true
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
server.port=${PORT:8080}

