spring.application.name=o-pai-o


spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/DevLapa}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:2208}
spring.datasource.driver-class-name=org.postgresql.Driver


spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${GMAIL_USER}
spring.mail.password=${GMAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true


app.frontend.url=${FRONTEND_URL:http://localhost:5173}


spring.jpa.hibernate.ddl-auto=update
spring.flyway.repair-at-start=true
spring.flyway.enabled=false
spring.flyway.out-of-order=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false


api.security.token.secret=${JWT_SECRET:89324789237489237489237489}
spring.mvc.hiddenmethod.filter.enabled=true
server.port=${PORT:8080}